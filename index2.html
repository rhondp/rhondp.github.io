<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhon P - Game Dev & Art Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #000000;
      --bg-secondary: #0d0d0d;
      --bg-tertiary: #111111;
      --text-primary: #ffffff;
      --accent: #ff0066; /* Hot pink/magenta - core accent like futuristic game sites */
      --accent-hover: #d40055;
      --card-bg: #1a1a1a;
      --glow: rgba(255, 0, 102, 0.4);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-primary);
      scroll-behavior: smooth;
    }

    /* Modern Fixed Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }

    .nav-link {
      color: white;
      font-weight: 600;
      transition: color 0.3s;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--accent);
    }

    /* Hamburger */
    .hamburger span {
      background: white;
      display: block;
      height: 3px;
      width: 28px;
      margin: 5px auto;
      transition: all 0.3s;
    }

    .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
    .hamburger.active span:nth-child(2) { opacity: 0; }
    .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(7px, -6px); }

    /* Sections with alternating subtle darks */
    section {
      padding-top: 8rem;
      padding-bottom: 6rem;
    }

    #top { background: linear-gradient(to bottom right, #1a0033, #000000); min-height: 100vh; }
    #games { background-color: var(--bg-secondary); }
    #apps { background-color: var(--bg-tertiary); }
    #2d { background-color: var(--bg-secondary); }
    #3d { background-color: var(--bg-tertiary); }
    #about, #contact { background-color: var(--bg-secondary); }

    h1, h2, h3 {
      font-weight: 800;
      letter-spacing: -0.025em;
    }

    h2 {
      color: var(--accent);
      position: relative;
      display: inline-block;
    }

    h2::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 60px;
      height: 4px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Card enhancements */
    .portfolio-card {
      background: var(--card-bg);
      border: 1px solid #222;
      transition: all 0.4s ease;
    }

    .portfolio-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 30px var(--glow);
    }

    /* Slideshow & Modal tweaks */
    .slideshow-button {
      background: rgba(255,0,102,0.7);
    }

    .slideshow-thumbnails .active-thumb {
      border: 2px solid var(--accent);
    }

    /* Accent links */
    a {
      color: var(--accent);
      transition: color 0.3s;
    }

    a:hover {
      color: var(--accent-hover);
    }

    @media (max-width: 768px) {
      .nav-menu {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: rgba(0,0,0,0.95);
        flex-direction: column;
        padding: 1.5rem;
        display: none;
      }

      .nav-menu.active {
        display: flex;
      }
    }
  </style>
</head>
<body>

  <!-- Header / Navigation -->
  <header class="py-4 px-6 md:px-12 flex justify-between items-center">
    <a href="#top" class="text-3xl font-bold text-white">Rhon <span class="text-[var(--accent)]">P</span></a>
    
    <nav class="hidden md:flex space-x-8">
      <a href="#top" class="nav-link">Top</a>
      <a href="#games" class="nav-link">Games</a>
      <a href="#apps" class="nav-link">Apps</a>
      <a href="#2d" class="nav-link">2D Art</a>
      <a href="#3d" class="nav-link">3D Art</a>
      <a href="#about" class="nav-link">About</a>
      <a href="#contact" class="nav-link">Contact</a>

    <!-- Hamburger for mobile -->
    <div class="md:hidden hamburger cursor-pointer" id="hamburger">
      <span></span>
      <span></span>

    <a href="#games" class="bg-[var(--accent)] hover:bg-[var(--accent-hover)] text-white font-bold py-4 px-10 rounded-full text-lg transition">Explore My Work</a>

  <!-- Games Corner (rest remains similar, just styled) -->
  <section id="games">

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">

  <!-- App Corner -->

  <!-- 3D Corner, About, Contact – similar adjustments -->

  <!-- Footer -->
  <footer class="py-12 bg-black text-center text-gray-500 border-t border-gray-800">
    © 2026 Rhon P. Built with passion for games & art.
  </footer>

  <!-- Keep your modal and slideshow script – it works great -->
  <!-- Add this small script for hamburger -->
  <script>
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      mobileMenu.classList.toggle('active');
    });

    // Optional: close mobile menu on link click
    document.querySelectorAll('#mobileMenu a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        mobileMenu.classList.remove('active');
      });
    });
  </script>

  <!-- Your original slideshow + lightbox script here -->

</html>
